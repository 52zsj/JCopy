name: 构建与发布

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: 构建（${{ matrix.label }}）
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS 不用 universal（lipo 合并）那条路：拆成两个 job 各自产出，
          # 一个原生 arm64、一个交叉到 x64（mac 之间交叉是受支持的，只需装 target）
          - os: macos-14
            label: macOS arm64
            arch: arm64
            rustTargets: ''
            buildArgs: '--bundles app'
            appDir: src-tauri/target/release/bundle/macos
          - os: macos-14
            label: macOS x64
            arch: x64
            rustTargets: x86_64-apple-darwin
            buildArgs: '--bundles app --target x86_64-apple-darwin'
            appDir: src-tauri/target/x86_64-apple-darwin/release/bundle/macos
          - os: windows-latest
            label: Windows x64
            arch: x64
            rustTargets: ''
            buildArgs: '--bundles nsis'
            appDir: ''
          - os: ubuntu-22.04
            label: Linux x64
            arch: x64
            rustTargets: ''
            buildArgs: '--bundles deb,appimage'
            appDir: ''

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 准备 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 准备 Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rustTargets }}

      - name: Rust 构建缓存
        uses: swatinem/rust-cache@v2
        with:
          workspaces: 'src-tauri -> target'

      - name: 安装 Linux 系统依赖
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev patchelf build-essential

      - name: 环境信息
        shell: bash
        run: |
          node -v && npm -v
          rustc -V && cargo -V
          npx tauri --version || true

      - name: 安装前端依赖
        run: npm ci

      - name: 单元测试
        shell: bash
        run: npm test

      - name: 编译并打包
        shell: bash
        # tauri.conf 里配了 beforeBuildCommand，前端会自动构建
        run: npx tauri build ${{ matrix.buildArgs }}

      - name: 生成 dmg 与 zip（macOS）
        if: startsWith(matrix.os, 'macos')
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./package.json').version")
          APP="${{ matrix.appDir }}/JCopy.app"
          bash scripts/make-dmg.sh "$APP" "${{ matrix.arch }}"
          mkdir -p "release/$VERSION"
          ditto -c -k --sequesterRsrc --keepParent "$APP" "release/$VERSION/JCopy-$VERSION-${{ matrix.arch }}.zip"

      - name: 归集产物
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist-artifacts
          case "${{ runner.os }}" in
            macOS)
              cp release/*/*.dmg release/*/*.zip dist-artifacts/
              ;;
            Windows)
              find src-tauri/target/release/bundle/nsis -name '*-setup.exe' -exec cp {} dist-artifacts/ \;
              ;;
            Linux)
              find src-tauri/target/release/bundle \( -name '*.deb' -o -name '*.AppImage' \) -exec cp {} dist-artifacts/ \;
              ;;
          esac
          echo "--- 产物 ---"
          ls -lh dist-artifacts

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: jcopy-${{ matrix.label }}
          path: dist-artifacts/*
          if-no-files-found: error

  release:
    name: 发布到 GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 准备 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 下载全部产物
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: 生成 Release 正文
        id: notes
        # 只取 CHANGELOG 当前版本那一节，避免把整份日志贴进 Release
        run: node scripts/changelog-section.mjs --github-output >> "$GITHUB_OUTPUT"

      - name: 创建 Release 并上传安装包
        uses: softprops/action-gh-release@v2
        with:
          body: ${{ steps.notes.outputs.body }}
          files: artifacts/**/*
          fail_on_unmatched_files: false
